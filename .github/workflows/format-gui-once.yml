name: Final formatter
on:
    push:
        branches: ['feat/monochrome-multiservice-dashboard']
permissions:
    contents: write
jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v5
              with:
                  version: latest
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
            - run: pnpm install
            - run: pnpm run prettier:fix
            - name: Commit source
              shell: bash
              run: |
                  set -euo pipefail
                  git add -u -- ':!.github/workflows/**'
                  if ! git diff --cached --quiet; then
                    git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: normalize per-platform defaults"
                    git push origin HEAD:feat/monochrome-multiservice-dashboard
                  fi
